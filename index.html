<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kushki Payment Assessment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .payment-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #6b7280;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .hosted-field {
            width: 100%;
            min-height: 44px;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: #ffffff;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1f2937;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            line-height: 1.5;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
        }

        .hidden {
            display: none;
        }

        .environment {
            display: inline-block;
            margin-bottom: 20px;
            padding: 5px 10px;
            border-radius: 20px;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="payment-card">

            <span class="environment">
                UAT / TEST
            </span>

            <h1>Pago con tarjeta</h1>

            <p class="subtitle">
                Kushki Payment Assessment
            </p>

            <form id="payment-form">

                <!-- Nombre del cliente -->
                <label for="name">
                    Nombre del titular
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    autocomplete="cc-name"
                    placeholder="Juan Martinez"
                    required
                >

                <!-- Número de tarjeta - Kushki Hosted Field -->
                <label>
                    Número de tarjeta
                </label>

                <div
                    id="card-number-container"
                    class="hosted-field"
                ></div>

                <!-- Expiración - Kushki Hosted Field -->
                <div class="row">

                    <div>
                        <label>
                            Mes
                        </label>

                        <div
                            id="card-expiry-month-container"
                            class="hosted-field"
                        ></div>
                    </div>

                    <div>
                        <label>
                            Año
                        </label>

                        <div
                            id="card-expiry-year-container"
                            class="hosted-field"
                        ></div>
                    </div>

                </div>

                <!-- CVV - Kushki Hosted Field -->
                <label>
                    CVV
                </label>

                <div
                    id="card-cvv-container"
                    class="hosted-field"
                ></div>

                <!-- Monto -->
                <label for="amount">
                    Monto
                </label>

                <input
                    id="amount"
                    name="amount"
                    type="number"
                    value="16.98"
                    min="0.01"
                    step="0.01"
                    readonly
                >

                <button
                    id="pay-button"
                    type="submit"
                >
                    Pagar $16.98 MXN
                </button>

            </form>

            <div
                id="result"
                class="result hidden"
            ></div>

        </section>

    </main>

    <!-- Kushki.js -->
    <script src="https://cdn.kushkipagos.com/js/kushki.min.js"></script>

    <!-- Kushki Hosted Fields -->
    <script src="https://cdn.kushkipagos.com/js/card.min.js"></script>

    <!-- Nuestra aplicación -->
    <script src="/app.js"></script>

</body>

</html>
